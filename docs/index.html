
<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Ritual de convite</title>

<style>

    body {
        margin: 0;
        padding: 16px;
        background: #14182e;
        color: #ffd778;
        font-family: Georgia, serif;
        text-align: center;
    }

    h1 {
        margin-top: 25px;
    }

    canvas {
        display: block;
        margin: 20px auto;
        max-width: 100%;
        height: auto;
        background: black;
        image-rendering: pixelated;
    }

    button {
        background: none;
        color: inherit;
        border: 1px solid;
        padding: 10px 20px;
        border-radius: 8px;
        cursor: pointer;
        font: inherit;
        margin-top: 15px;
    }

    button:hover {
        background: #ffd778;
        color: #14182e;
    }

    #contagem {
        margin-top: 20px;
    }

    #status {
        color: #b9a9dc;
        font-size: 14px;
    }

</style>

</head>

<body>

<h1>Sor Richard, você é nosso convidado especial!</h1>

<p>E nós te invocamos agora para a formatura de IA&Dados 2026...</p>

<canvas id="c"></canvas>

<h2 id="contagem"></h2>

<p id="status">Preparando o ritual...</p>

<button id="reinvocar">Reinvocar</button>


<script>

// ========================================
// CONFIGURAÇÕES
// ========================================

const DATA_FORMATURA = new Date(2026, 11, 15);

const DURACAO_SEGUNDOS = 25;

const PAUSA_CENAS = 600;


// ========================================
// CONTAGEM REGRESSIVA
// ========================================

function atualizarContagem() {

    const dias = Math.ceil(
        (DATA_FORMATURA - new Date()) / 86400000
    );

    document.getElementById("contagem").textContent =
        dias > 0
            ? `Faltam ${dias} dias para a formatura, te esperamos lá muahahahaha`
            : "A formatura chegou, as forças maiores te puxam!";

}

atualizarContagem();


// ========================================
// CANVAS
// ========================================

const canvas = document.getElementById("c");

const ctx = canvas.getContext("2d");

const status = document.getElementById("status");

let desenho = null;

let animacao = null;


// ========================================
// PREPARAÇÃO
// ========================================

function preparar(d) {

    desenho = d;

    canvas.width = d.largura;
    canvas.height = d.altura;

    document.body.style.background = d.fundo;

    ctx.imageSmoothingEnabled = false;

    ctx.fillStyle = d.fundo;

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

}


// ========================================
// DESENHAR RETÂNGULO
// ========================================

function desenharRetangulo(r) {

    ctx.fillStyle = r.cor;

    ctx.fillRect(
        r.x,
        r.y,
        r.w,
        r.h
    );

}


// ========================================
// ANIMAÇÃO
// ========================================


function animar() {

    if (!desenho) return;

    cancelAnimationFrame(animacao);

    // Limpa o desenho anterior
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = desenho.fundo;

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    // Duração de cada cena
    const TEMPOS = {
        simbolo_fundo: 6000,
        simbolo_centro: 2500,
        personagem: 5000
    };

    const PAUSA_CENAS = 500;

    const MENSAGENS = {
        simbolo_fundo: "O símbolo está sendo invocado...",
        simbolo_centro: "A energia central está se manifestando...",
        personagem: "Uma presença está se materializando..."
    };


    let cenaAtual = 0;
    let indiceRetangulo = 0;
    let inicioCena = null;
    let proximaCena = 0;

    const cenas = desenho.cenas;


    function passo(tempo) {

        // Todas as cenas foram concluídas
        if (cenaAtual >= cenas.length) {

            status.textContent = "Ritual concluído.";

            animacao = null;

            return;
        }


        // Aguarda a pausa entre as cenas
        if (tempo < proximaCena) {

            animacao = requestAnimationFrame(passo);

            return;
        }


        const cena = cenas[cenaAtual];

        const retangulos = cena.retangulos;

        const duracao = TEMPOS[cena.nome] || 2000;


        // Início da cena
        if (inicioCena === null) {

            inicioCena = tempo;

            indiceRetangulo = 0;

            status.textContent =
                MENSAGENS[cena.nome] || "O ritual continua...";

        }


        // Calcula o progresso
        const progresso = Math.min(
            (tempo - inicioCena) / duracao,
            1
        );


        // Quantidade de retângulos que devem aparecer
        const quantidade = Math.floor(
            progresso * retangulos.length
        );


        // Desenha os novos retângulos
        while (indiceRetangulo < quantidade) {

            desenharRetangulo(
                retangulos[indiceRetangulo]
            );

            indiceRetangulo++;

        }


        // Finaliza a cena
        if (progresso >= 1) {

            cenaAtual++;

            inicioCena = null;

            indiceRetangulo = 0;

            proximaCena = tempo + PAUSA_CENAS;

        }


        animacao = requestAnimationFrame(passo);

    }


    animacao = requestAnimationFrame(passo);

}

        // Todas as cenas foram concluídas
        if (cenaAtual >= cenas.length) {

            status.textContent = "Ritual concluído.";

            animacao = null;

            return;
        }


        // Aguarda a pausa entre as cenas
        if (tempo < proximaCena) {

            animacao = requestAnimationFrame(passo);

            return;
        }


        const cena = cenas[cenaAtual];

        const retangulos = cena.retangulos;


        if (inicioCena === null) {

            inicioCena = tempo;

            status.textContent =
                cena.nome === "simbolo"
                    ? "O símbolo está sendo invocado..."
                    : "Algo está surgindo no centro...";

        }

        const progresso = Math.min(

            1
        );


        // Quantos retângulos já podem aparecer

        );


        // Desenha somente os novos retângulos
        while (indiceRetangulo < quantidade) {

        if (progresso >= 1) {

            indiceRetangulo = 0;

            proximaCena = tempo + PAUSA_CENAS;

        }


        animacao = requestAnimationFrame(passo);

    }


    animacao = requestAnimationFrame(passo);


// ========================================
// CARREGAMENTO DO JSON
// ========================================

fetch("desenho.json")

    .then(resposta => {

        if (!resposta.ok) {

            throw new Error("Não foi possível carregar desenho.json");

        }

        return resposta.json();

    })

    .then(d => {

        preparar(d);

        status.textContent = "O ritual vai começar...";

        animar();

    })

    .catch(erro => {

        console.error(erro);

        status.textContent =
            "Erro ao carregar o desenho. Verifique o console.";

    });


// ========================================
// BOTÃO REVER
// ========================================

document.getElementById("reinvocar").onclick = animar;

</script>

</body>
</html>
